[project]
name = "hermes-agent"
version = "0.1.0"
description = "AI Agent Framework"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "playwright>=1.61.0",
]

[project.scripts]
hermes-crawl = "hermes_agent.cli.crawl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
